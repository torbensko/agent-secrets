name: Secrets
options:
  bundleIdPrefix: com.torbensko
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: D6WA425MQA
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SECRETS_UPDATE_CHANNEL: Development
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES
targets:
  Secrets:
    type: application
    platform: macOS
    sources: [Secrets]
    dependencies:
      - package: Sparkle
    configFiles:
      Debug: Config/Updates.xcconfig
      Release: Config/Updates.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torbensko.secrets
        PRODUCT_NAME: Agent Secrets
        PRODUCT_MODULE_NAME: Secrets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Secrets/Secrets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Secrets/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: Agent Secrets
  SecretsTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SecretsTests]
    dependencies:
      - target: Secrets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # XcodeGen derives the host from the target name, not the product name.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Agent Secrets.app/Contents/MacOS/Agent Secrets
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Secrets:
    build:
      targets:
        Secrets: all
    test:
      targets: [SecretsTests]
    run:
      config: Debug
